<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Browse movies on MovieVibe" />
    <title>Browse movies | MovieVibe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/movies.css" />
  </head>
  <body>
    <div id="site-nav"></div>
    <main>
      <section class="page-header">
        <div class="container">
          <span class="eyebrow"><i class="bi bi-collection-play-fill"></i> The complete collection</span>
          <h1>Browse movies</h1>
          <p>Explore stories across every genre, decade, language, and mood.</p>
        </div>
      </section>
      <section class="section-block pt-4">
        <div class="container">
          <div class="filter-panel">
            <div class="search-wrap">
              <i class="bi bi-search"></i>
              <input
                id="movie-search"
                type="search"
                placeholder="Search by title, genre, director, cast, or language..."
                aria-label="Search movies"
              />
            </div>
            <select
              id="genre-filter"
              class="form-select"
              aria-label="Filter by genre"
            >
              <option value="all">All genres</option>
            </select>
            <select
              id="sort-select"
              class="form-select"
              aria-label="Sort movies"
            >
              <option value="default">Sort: Featured</option>
              <option value="rating-desc">Rating: High to Low</option>
              <option value="rating-asc">Rating: Low to High</option>
              <option value="year-desc">Newest First</option>
              <option value="year-asc">Oldest First</option>
            </select>
          </div>
          <div class="results-bar">
            <span id="results-count"></span>
            <button id="clear-filters" class="btn btn-sm btn-link d-none">
              Clear filters
            </button>
          </div>
          <div id="movies-grid" class="row g-4"></div>
          <div id="empty-results" class="empty-state d-none">
            <i class="bi bi-film"></i>
            <h3>No movies found</h3>
            <p>Try a different search or reset your filters.</p>
          </div>
          <div class="text-center mt-5">
            <button id="show-more" class="btn btn-outline-primary px-4">
              Show more movies
            </button>
          </div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../data/movies-data.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/movies.js"></script>
  </body>
</html>
