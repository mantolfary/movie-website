<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Your favorite movies on MovieVibe" />
    <title>Favorites | MovieVibe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/favorites.css" />
  </head>
  <body>
    <div id="site-nav"></div>
    <main>
      <section class="page-header">
        <div class="container">
          <span class="eyebrow">Your saved collection</span>
          <h1>Favorites</h1>
          <p>Keep the movies you love close at hand.</p>
        </div>
      </section>
      <section class="section-block pt-4">
        <div class="container">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h4 mb-0">Your watchlist</h2>
            <button id="clear-all" class="btn btn-outline-danger btn-sm">
              Clear all
            </button>
          </div>
          <div id="favorites-grid" class="row g-4"></div>
          <div id="empty-favorites" class="empty-state d-none">
            <i class="bi bi-heart"></i>
            <h3>You don't have any favorites yet</h3>
            <p>Save movies you love and they'll appear here.</p>
            <a href="movies.html" class="btn btn-primary mt-2"
              >Explore movies</a
            >
          </div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../data/movies-data.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/favorites.js"></script>
  </body>
</html>
